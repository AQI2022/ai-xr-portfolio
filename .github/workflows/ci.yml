name: portfolio-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev,mcp]'
      - run: ruff check ai_xr experiments scripts tests
      - run: pytest -q
      - run: python scripts/seed_demo.py
      - run: python experiments/evaluate_rag.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-xr-portfolio .
      - run: docker run -d --name xr -p 8000:8000 ai-xr-portfolio
      - run: python -c "import time,urllib.request; time.sleep(8); print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
